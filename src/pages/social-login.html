<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Social Manager — Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      font-family: 'Segoe UI', sans-serif;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    h1 {
      color: #fff;
      font-size: 22px;
      margin-bottom: 8px;
    }

    p {
      color: #888;
      font-size: 14px;
      margin-bottom: 32px;
    }

    .error-msg {
      background: #ff3b3b22;
      border: 1px solid #ff3b3b55;
      color: #ff7070;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }

    .error-msg.visible { display: block; }

    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #111;
      color: #fff;
      font-size: 15px;
      outline: none;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }

    input[type="password"]:focus { border-color: #7c3aed; }

    button {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: none;
      background: #7c3aed;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #6d28d9; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🎬</div>
    <h1>Social Manager</h1>
    <p>Acceso restringido. Ingresa tu contraseña.</p>

    <div class="error-msg" id="errorMsg">Contraseña incorrecta. Inténtalo de nuevo.</div>

    <form method="POST" action="/social/login">
      <input type="hidden" name="next" id="nextPath" value="">
      <input type="password" name="password" placeholder="Contraseña" autofocus required />
      <button type="submit">Entrar</button>
    </form>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    document.getElementById("nextPath").value = params.get("next") || "";
    if (params.get("error")) {
      document.getElementById("errorMsg").classList.add("visible");
    }
  </script>
</body>
</html>
