<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LALEX - Código de Creador con Personaje</title>

  <style>
    :root {
      --purple: #8b2cff;
      --purple-soft: #c46cff;
      --blue: #00cfff;
      --blue-soft: #6be8ff;
      --gold: #ffd84d;
      --panel: rgba(4, 7, 22, 0.94);
      --text: #ffffff;
      --width: 1000px;
      --height: 240px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stage {
      position: relative;
      width: var(--width);
      height: var(--height);
      overflow: hidden;
      background: transparent;
      isolation: isolate;
    }

    .widget {
      position: absolute;
      inset: 6px 10px;
      display: grid;
      grid-template-columns: 230px 1fr 115px;
      align-items: center;
      opacity: 0;
      transform: translateY(34px) scale(.97);
      animation:
        appear .9s cubic-bezier(.16,.84,.32,1) forwards,
        breathing 3.2s ease-in-out 1.1s infinite;
    }

    @keyframes appear {
      0% {
        opacity: 0;
        transform: translateY(34px) scale(.97);
        filter: blur(7px);
      }
      70% {
        opacity: 1;
        filter: blur(0);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    @keyframes breathing {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-2px) scale(1.003); }
    }

    .character-box {
      position: relative;
      width: 220px;
      height: 220px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 6;
    }

    .character-halo {
      position: absolute;
      width: 170px;
      height: 170px;
      left: 22px;
      bottom: 17px;
      border-radius: 50%;
      background:
        radial-gradient(circle,
          rgba(255,255,255,.28) 0%,
          rgba(139,44,255,.24) 28%,
          rgba(0,207,255,.14) 48%,
          transparent 72%);
      filter: blur(6px);
      animation: haloPulse 2.8s ease-in-out infinite;
    }

    @keyframes haloPulse {
      0%,100% { transform: scale(.94); opacity: .65; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    .character-frame {
      position: absolute;
      left: 4px;
      bottom: 8px;
      width: 198px;
      height: 198px;
      border-radius: 34px;
      border: 3px solid rgba(139,44,255,.85);
      background:
        radial-gradient(circle at 40% 30%, rgba(139,44,255,.2), transparent 45%),
        linear-gradient(145deg, rgba(8,11,35,.82), rgba(4,6,20,.65));
      box-shadow:
        0 0 18px rgba(139,44,255,.7),
        0 0 38px rgba(0,207,255,.27),
        inset 0 0 24px rgba(139,44,255,.2);
      clip-path: polygon(8% 0, 92% 0, 100% 10%, 100% 90%, 90% 100%, 10% 100%, 0 90%, 0 10%);
      animation: frameGlow 2.7s ease-in-out infinite;
    }

    .character-frame::before {
      content: "";
      position: absolute;
      inset: 8px;
      clip-path: inherit;
      border: 2px solid rgba(0,207,255,.4);
    }

    @keyframes frameGlow {
      0%,100% {
        box-shadow:
          0 0 18px rgba(139,44,255,.58),
          0 0 34px rgba(0,207,255,.24),
          inset 0 0 22px rgba(139,44,255,.18);
      }
      50% {
        box-shadow:
          0 0 29px rgba(139,44,255,.94),
          0 0 52px rgba(0,207,255,.44),
          inset 0 0 30px rgba(139,44,255,.3);
      }
    }

    .character {
      position: relative;
      z-index: 8;
      width: 218px;
      height: 218px;
      object-fit: contain;
      object-position: center bottom;
      filter:
        drop-shadow(0 0 7px rgba(255,255,255,.35))
        drop-shadow(0 0 13px rgba(139,44,255,.75))
        drop-shadow(0 0 18px rgba(0,207,255,.42));
      transform-origin: 50% 88%;
      animation: characterFloat 2.8s ease-in-out infinite;
    }

    @keyframes characterFloat {
      0%,100% { transform: translateY(2px) rotate(0deg) scale(1); }
      50% { transform: translateY(-5px) rotate(-1deg) scale(1.015); }
    }

    .character-shine {
      position: absolute;
      z-index: 12;
      top: 18px;
      bottom: 12px;
      left: -42px;
      width: 34px;
      pointer-events: none;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.8), transparent);
      transform: skewX(-22deg);
      filter: blur(3px);
      opacity: 0;
      animation: characterSweep 4.4s ease-in-out 1.2s infinite;
    }

    @keyframes characterSweep {
      0%,58% { left: -42px; opacity: 0; }
      64% { opacity: .9; }
      82% { left: 230px; opacity: 0; }
      100% { left: 230px; opacity: 0; }
    }

    .panel {
      position: relative;
      height: 164px;
      margin-left: -36px;
      padding: 25px 68px 22px 96px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(10,12,34,.975), rgba(4,7,22,.95)),
        radial-gradient(circle at 82% 50%, rgba(0,207,255,.11), transparent 46%);
      clip-path: polygon(
        0 12%, 5% 12%, 7% 0, 95% 0,
        100% 22%, 97% 100%, 7% 100%,
        4% 88%, 0 88%
      );
      border-top: 2px solid rgba(139,44,255,.96);
      border-bottom: 2px solid rgba(0,207,255,.92);
      box-shadow:
        0 0 20px rgba(139,44,255,.28),
        inset 0 0 25px rgba(0,207,255,.04);
      z-index: 3;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(0,207,255,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(139,44,255,.08) 1px, transparent 1px);
      background-size: 24px 24px;
      mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent);
      opacity: .55;
      animation: gridMove 10s linear infinite;
    }

    @keyframes gridMove {
      from { background-position: 0 0, 0 0; }
      to { background-position: 48px 24px, 24px 48px; }
    }

    .eyebrow {
      position: relative;
      z-index: 3;
      margin: 0 0 5px;
      font-size: 23px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: 1.5px;
      font-style: italic;
      text-transform: uppercase;
      color: var(--blue);
      text-shadow: 0 0 12px rgba(0,207,255,.72);
    }

    .code-line {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin: 0;
      white-space: nowrap;
    }

    .label {
      font-size: 35px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: .8px;
      font-style: italic;
      text-transform: uppercase;
      color: #fff;
    }

    .code {
      display: inline-block;
      font-size: 68px;
      line-height: .92;
      font-weight: 1000;
      letter-spacing: 2px;
      font-style: italic;
      text-transform: uppercase;
      color: #fff;
      text-shadow:
        0 0 6px #fff,
        0 0 14px rgba(139,44,255,.85),
        0 0 28px rgba(0,207,255,.58);
      animation: codeGlow 2.3s ease-in-out infinite;
    }

    @keyframes codeGlow {
      0%,100% {
        text-shadow:
          0 0 6px #fff,
          0 0 14px rgba(139,44,255,.72),
          0 0 24px rgba(0,207,255,.45);
      }
      50% {
        text-shadow:
          0 0 9px #fff,
          0 0 23px rgba(139,44,255,1),
          0 0 40px rgba(0,207,255,.8);
      }
    }

    .thanks {
      position: relative;
      z-index: 3;
      margin: 9px 0 0;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: .8px;
      text-transform: uppercase;
      color: rgba(255,255,255,.76);
    }

    .crown-wrap {
      position: relative;
      height: 164px;
      margin-left: -20px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 7;
    }

    .crown {
      width: 88px;
      height: 88px;
      filter:
        drop-shadow(0 0 8px rgba(255,216,77,.92))
        drop-shadow(0 0 22px rgba(255,216,77,.58));
      animation: crownBounce 2.4s ease-in-out infinite;
      transform-origin: 50% 80%;
    }

    @keyframes crownBounce {
      0%,100% { transform: translateY(0) rotate(0deg) scale(1); }
      45% { transform: translateY(-5px) rotate(-3deg) scale(1.04); }
      60% { transform: translateY(-2px) rotate(2deg) scale(1.02); }
    }

    .shine {
      position: absolute;
      top: -15%;
      bottom: -15%;
      left: -35%;
      width: 16%;
      z-index: 10;
      pointer-events: none;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.82), transparent);
      transform: skewX(-24deg);
      filter: blur(3px);
      opacity: 0;
      animation: shineSweep 4s ease-in-out 1s infinite;
    }

    @keyframes shineSweep {
      0%,56% { left: -35%; opacity: 0; }
      62% { opacity: .95; }
      82% { left: 120%; opacity: 0; }
      100% { left: 120%; opacity: 0; }
    }

    .flare {
      position: absolute;
      right: 126px;
      top: 50%;
      width: 9px;
      height: 9px;
      z-index: 12;
      border-radius: 50%;
      background: #fff;
      opacity: 0;
      box-shadow:
        0 0 7px #fff,
        0 0 15px var(--blue-soft),
        0 0 30px var(--blue),
        0 0 48px var(--purple);
      animation: flarePulse 4.6s ease-in-out 1.4s infinite;
    }

    .flare::before,
    .flare::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.95), transparent);
      transform: translate(-50%, -50%);
    }

    .flare::before { width: 120px; height: 2px; }
    .flare::after { width: 2px; height: 62px; }

    @keyframes flarePulse {
      0%,76%,100% { opacity: 0; transform: scale(.5); }
      84% { opacity: 1; transform: scale(1.12); }
      91% { opacity: .15; transform: scale(.8); }
    }

    .particles {
      position: absolute;
      inset: 0;
      z-index: 8;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 7px var(--blue), 0 0 13px var(--purple);
      opacity: 0;
      animation: floatUp var(--dur) ease-in-out var(--delay) infinite;
    }

    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(18px) scale(.6); }
      20% { opacity: .85; }
      72% { opacity: .45; }
      100% { opacity: 0; transform: translateY(-54px) scale(1.15); }
    }

    .accent-bars {
      position: absolute;
      right: 148px;
      bottom: 35px;
      width: 90px;
      height: 10px;
      z-index: 6;
      background:
        linear-gradient(
          90deg,
          var(--purple) 0 18%, transparent 18% 26%,
          var(--purple-soft) 26% 44%, transparent 44% 52%,
          var(--blue) 52% 70%, transparent 70% 78%,
          var(--blue-soft) 78% 100%
        );
      transform: skewX(-28deg);
      filter: drop-shadow(0 0 8px rgba(0,207,255,.65));
    }

    @media (max-width: 1020px) {
      .stage {
        transform: scale(calc(100vw / 1020));
        transform-origin: center;
      }
    }
  </style>
</head>

<body>
  <main class="stage">
    <section class="widget">

      <div class="character-box" aria-hidden="true">
        <div class="character-halo"></div>
        <div class="character-frame"></div>
        <div class="character-shine"></div>
        <img class="character" src="lalex-personaje.png" alt="" />
      </div>

      <div class="panel">
        <div class="particles">
          <i class="particle" style="left:16%;top:78%;--dur:3.8s;--delay:.2s"></i>
          <i class="particle" style="left:31%;top:67%;--dur:4.4s;--delay:1.1s"></i>
          <i class="particle" style="left:49%;top:82%;--dur:3.9s;--delay:.7s"></i>
          <i class="particle" style="left:65%;top:72%;--dur:4.8s;--delay:1.6s"></i>
          <i class="particle" style="left:81%;top:84%;--dur:3.7s;--delay:.4s"></i>
        </div>

        <div class="shine"></div>
        <div class="flare"></div>

        <p class="eyebrow">Apoya al canal</p>

        <p class="code-line">
          <span class="label">Usa código</span>
          <span class="code">LALEX</span>
        </p>

        <p class="thanks">En la tienda de Fortnite · ¡Muchas gracias!</p>
      </div>

      <div class="crown-wrap" aria-hidden="true">
        <svg class="crown" viewBox="0 0 100 100">
          <defs>
            <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fff5a8"/>
              <stop offset=".45" stop-color="#ffd84d"/>
              <stop offset="1" stop-color="#f3a900"/>
            </linearGradient>
          </defs>
          <path d="M15 72L8 28l24 19 18-35 18 35 24-19-7 44z" fill="url(#gold)" stroke="#fff1a0" stroke-width="4" stroke-linejoin="round"/>
          <rect x="18" y="70" width="64" height="16" rx="5" fill="url(#gold)" stroke="#fff1a0" stroke-width="4"/>
          <circle cx="8" cy="28" r="5" fill="#fff3a6"/>
          <circle cx="50" cy="12" r="5" fill="#fff3a6"/>
          <circle cx="92" cy="28" r="5" fill="#fff3a6"/>
        </svg>
      </div>

      <div class="accent-bars"></div>
    </section>
  </main>
</body>
</html>
