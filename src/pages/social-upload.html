<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Social Manager — Subir Video</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0f0f0f;
      font-family: 'Segoe UI', sans-serif;
      color: #e0e0e0;
    }

    header {
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 { font-size: 18px; color: #fff; }
    header h1 span { color: #7c3aed; }

    .logout-btn {
      background: transparent;
      border: 1px solid #333;
      color: #888;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .logout-btn:hover { border-color: #555; color: #ccc; }

    main {
      max-width: 780px;
      margin: 40px auto;
      padding: 0 24px;
    }

    /* ── Plataformas ── */
    .section-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #666;
      margin-bottom: 16px;
    }

    .platforms {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 36px;
    }

    .platform-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 14px;
      padding: 20px 16px;
      text-align: center;
    }

    .platform-card .logo { font-size: 32px; margin-bottom: 10px; }
    .platform-card .logo img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 10px;
      display: block;
      border: 2px solid #2a2a2a;
    }
    .platform-card .username { font-size: 12px; color: #666; margin-bottom: 4px; }
    .platform-card .name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .platform-card .status {
      font-size: 12px;
      color: #666;
      margin-bottom: 14px;
    }
    .platform-card .status.connected { color: #22c55e; }

    .connect-btn {
      display: inline-block;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      border: none;
      transition: background 0.2s;
    }

    .connect-btn.connect { background: #7c3aed; color: #fff; }
    .connect-btn.connect:hover { background: #6d28d9; }
    .connect-btn.disconnect { background: #2a2a2a; color: #888; }
    .connect-btn.disconnect:hover { background: #333; color: #ccc; }

    /* ── Formulario ── */
    .upload-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #aaa;
      margin-bottom: 8px;
      font-weight: 500;
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 12px 14px;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      outline: none;
      margin-bottom: 20px;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus,
    textarea:focus { border-color: #7c3aed; }

    textarea { resize: vertical; min-height: 90px; }

    /* Drop zone */
    .drop-zone {
      border: 2px dashed #2a2a2a;
      border-radius: 12px;
      padding: 40px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      margin-bottom: 20px;
    }

    .drop-zone:hover, .drop-zone.over {
      border-color: #7c3aed;
      background: #7c3aed11;
    }

    .drop-zone .dz-icon { font-size: 40px; margin-bottom: 10px; }
    .drop-zone .dz-text { font-size: 14px; color: #aaa; }
    .drop-zone .dz-text strong { color: #7c3aed; }
    .drop-zone .dz-file-name { font-size: 13px; color: #22c55e; margin-top: 8px; }

    input[type="file"] { display: none; }

    /* Selección de plataformas en el form */
    .platform-checks {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .plat-check {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
      user-select: none;
      transition: border-color 0.2s;
    }

    .plat-check input { display: none; }
    .plat-check .plat-icon { font-size: 18px; }
    .plat-check .plat-label { font-size: 13px; font-weight: 600; }
    .plat-check.selected { border-color: #7c3aed; background: #7c3aed18; }
    .plat-check.disabled { opacity: 0.4; pointer-events: none; }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: #7c3aed;
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .submit-btn:hover { background: #6d28d9; }
    .submit-btn:disabled { background: #444; cursor: not-allowed; }

    /* Notificación */
    .toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 16px 20px;
      max-width: 340px;
      font-size: 14px;
      transform: translateY(20px);
      opacity: 0;
      transition: all 0.3s;
      z-index: 999;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { border-color: #22c55e55; }
    .toast.error { border-color: #ff3b3b55; }
    .toast .toast-title { font-weight: 700; margin-bottom: 4px; }
    .toast.success .toast-title { color: #22c55e; }
    .toast.error .toast-title { color: #ff7070; }

    /* Progress */
    .progress-bar-wrap {
      width: 100%;
      height: 6px;
      background: #2a2a2a;
      border-radius: 99px;
      margin-bottom: 20px;
      overflow: hidden;
      display: none;
    }
    .progress-bar {
      height: 100%;
      background: #7c3aed;
      border-radius: 99px;
      width: 0%;
      transition: width 0.3s;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎬 <span>Social</span> Manager</h1>
    <a href="/social/logout" class="logout-btn">Cerrar sesión</a>
  </header>

  <main>
    <!-- Conexión de plataformas -->
    <p class="section-title">Cuentas conectadas</p>
    <div class="platforms">

      <div class="platform-card" id="yt-card">
        <div class="logo" id="yt-logo">▶️</div>
        <div class="name">YouTube</div>
        <div class="username" id="yt-username" style="display:none; font-size: 12px; color: #666; margin-bottom: 4px;"></div>
        <div class="status" id="yt-status">Cargando...</div>
        <a class="connect-btn" id="yt-btn" href="/api/social/youtube/connect">Conectar</a>
      </div>

      <div class="platform-card" id="ig-card">
        <div class="logo" id="ig-logo">📸</div>
        <div class="name">Instagram</div>
        <div class="username" id="ig-username" style="display:none; font-size: 12px; color: #666; margin-bottom: 4px;"></div>
        <div class="status" id="ig-status">Cargando...</div>
        <a class="connect-btn" id="ig-btn" href="/api/social/instagram/connect">Conectar</a>
      </div>

      <div class="platform-card" id="tt-card">
        <div class="logo" id="tt-logo">🎵</div>
        <div class="name">TikTok</div>
        <div class="username" id="tt-username" style="display:none; font-size: 12px; color: #666; margin-bottom: 4px;"></div>
        <div class="status" id="tt-status">Cargando...</div>
        <a class="connect-btn" id="tt-btn" href="/api/social/tiktok/connect">Conectar</a>
      </div>

    </div>

    <!-- Formulario de subida -->
    <p class="section-title">Subir video</p>
    <div class="upload-card">
      <form id="uploadForm" enctype="multipart/form-data">

        <label>Título del video</label>
        <input type="text" name="title" placeholder="Ej: Mi mejor momento en stream" required />

        <label>Descripción</label>
        <textarea name="description" placeholder="Describe tu video..."></textarea>

        <label>Archivo de video</label>
        <div class="drop-zone" id="dropZone">
          <div class="dz-icon">🎥</div>
          <div class="dz-text">Arrastra tu video aquí o <strong>haz clic para seleccionar</strong></div>
          <div class="dz-file-name" id="dzFileName"></div>
        </div>
        <input type="file" name="video" id="videoInput" accept="video/*" />

        <label>Publicar en</label>
        <div class="platform-checks">
          <label class="plat-check disabled" id="check-yt">
            <input type="checkbox" name="platforms" value="youtube" />
            <span class="plat-icon">▶️</span>
            <span class="plat-label">YouTube</span>
          </label>
          <label class="plat-check disabled" id="check-ig">
            <input type="checkbox" name="platforms" value="instagram" />
            <span class="plat-icon">📸</span>
            <span class="plat-label">Instagram</span>
          </label>
          <label class="plat-check disabled" id="check-tt">
            <input type="checkbox" name="platforms" value="tiktok" />
            <span class="plat-icon">🎵</span>
            <span class="plat-label">TikTok</span>
          </label>
        </div>

        <div class="progress-bar-wrap" id="progressWrap">
          <div class="progress-bar" id="progressBar"></div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Subir video</button>
      </form>
    </div>
  </main>

  <div class="toast" id="toast">
    <div class="toast-title" id="toastTitle"></div>
    <div id="toastBody"></div>
  </div>

  <script>
    const platformMap = {
      youtube:   { status: 'yt-status',  btn: 'yt-btn',  check: 'check-yt',  logo: 'yt-logo',  username: 'yt-username',  connectHref: '/api/social/youtube/connect',   disconnectHref: '/api/social/youtube/disconnect'   },
      instagram: { status: 'ig-status',  btn: 'ig-btn',  check: 'check-ig',  logo: 'ig-logo',  username: 'ig-username',  connectHref: '/api/social/instagram/connect', disconnectHref: '/api/social/instagram/disconnect' },
      tiktok:    { status: 'tt-status',  btn: 'tt-btn',  check: 'check-tt',  logo: 'tt-logo',  username: 'tt-username',  connectHref: '/api/social/tiktok/connect',    disconnectHref: '/api/social/tiktok/disconnect'    },
    };

    async function loadStatus() {
      try {
        const res = await fetch('/api/social/status');
        const data = await res.json();

        for (const [platform, config] of Object.entries(data)) {
          const cfg = platformMap[platform];
          if (!cfg) continue;

          const statusEl = document.getElementById(cfg.status);
          const btnEl    = document.getElementById(cfg.btn);
          const checkEl  = document.getElementById(cfg.check);
          const checkInput = checkEl.querySelector('input');
          const logoEl   = document.getElementById(cfg.logo);
          const usernameEl = document.getElementById(cfg.username);

          if (config.connected) {
            statusEl.textContent = '✅ Conectado';
            statusEl.className = 'status connected';
            btnEl.textContent = 'Desconectar';
            btnEl.className = 'connect-btn disconnect';
            btnEl.href = cfg.disconnectHref;
            checkEl.classList.remove('disabled');

            // Mostrar foto de perfil si existe
            if (config.photo) {
              logoEl.innerHTML = `<img src="${config.photo}" alt="${platform}">`;
            }

            // Mostrar nombre de usuario
            if (config.name) {
              usernameEl.textContent = config.name;
              usernameEl.style.display = 'block';
            }
          } else {
            statusEl.textContent = 'No conectado';
            statusEl.className = 'status';
            btnEl.textContent = 'Conectar';
            btnEl.className = 'connect-btn connect';
            btnEl.href = cfg.connectHref;
            checkEl.classList.add('disabled');
            checkInput.checked = false;

            // Restablecer logo a emoji
            const defaultEmojis = { youtube: '▶️', instagram: '📸', tiktok: '🎵' };
            logoEl.innerHTML = defaultEmojis[platform] || '🔗';
            usernameEl.style.display = 'none';
          }
        }

        // Mostrar notificaciones de URL
        const params = new URLSearchParams(location.search);
        const connected = params.get('connected');
        const disconnected = params.get('disconnected');
        const error = params.get('error');
        if (connected) showToast('success', '¡Cuenta conectada!', `${connected} conectado correctamente.`);
        if (disconnected) showToast('info', 'Desconectado', `${disconnected} desconectado.`);
        if (error) showToast('error', 'Error de conexión', `No se pudo conectar: ${error}`);
        history.replaceState({}, '', '/social/upload');

      } catch (e) {
        console.error('Error cargando estado:', e);
      }
    }

    // ── Drop zone ─────────────────────────────────────────────────────────────
    const dropZone = document.getElementById('dropZone');
    const videoInput = document.getElementById('videoInput');
    const dzFileName = document.getElementById('dzFileName');

    dropZone.addEventListener('click', () => videoInput.click());

    dropZone.addEventListener('dragover', e => {
      e.preventDefault();
      dropZone.classList.add('over');
    });

    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));

    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('over');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('video/')) {
        setFile(file);
      }
    });

    videoInput.addEventListener('change', () => {
      if (videoInput.files[0]) setFile(videoInput.files[0]);
    });

    function setFile(file) {
      // Crear un DataTransfer para asignar el archivo al input
      const dt = new DataTransfer();
      dt.items.add(file);
      videoInput.files = dt.files;
      dzFileName.textContent = `📁 ${file.name} (${(file.size / 1024 / 1024).toFixed(1)} MB)`;
    }

    // ── Selección de plataformas ──────────────────────────────────────────────
    document.querySelectorAll('.plat-check').forEach(label => {
      label.addEventListener('click', () => {
        if (label.classList.contains('disabled')) return;
        const input = label.querySelector('input');
        input.checked = !input.checked;
        label.classList.toggle('selected', input.checked);
      });
    });

    // ── Subida ────────────────────────────────────────────────────────────────
    const form = document.getElementById('uploadForm');
    const submitBtn = document.getElementById('submitBtn');
    const progressWrap = document.getElementById('progressWrap');
    const progressBar = document.getElementById('progressBar');

    form.addEventListener('submit', async e => {
      e.preventDefault();

      const selectedPlatforms = [...form.querySelectorAll('input[name="platforms"]:checked')];
      if (selectedPlatforms.length === 0) {
        return showToast('error', 'Sin plataformas', 'Selecciona al menos una plataforma.');
      }

      if (!videoInput.files[0]) {
        return showToast('error', 'Sin video', 'Selecciona un archivo de video.');
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Subiendo...';
      progressWrap.style.display = 'block';
      animateProgress();

      const formData = new FormData(form);

      try {
        const res = await fetch('/api/social/upload', { method: 'POST', body: formData });
        const data = await res.json();

        if (data.ok) {
          progressBar.style.width = '100%';
          const results = data.results;
          const lines = Object.entries(results).map(([p, r]) =>
            `${p}: ${r.ok ? '✅ OK' : '❌ ' + r.error}`
          ).join('\n');
          showToast('success', 'Subida completada', lines);
          form.reset();
          dzFileName.textContent = '';
          document.querySelectorAll('.plat-check').forEach(l => l.classList.remove('selected'));
        } else {
          showToast('error', 'Error', data.error || 'Error desconocido');
        }
      } catch (err) {
        showToast('error', 'Error de red', err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Subir video';
        progressWrap.style.display = 'none';
        progressBar.style.width = '0%';
      }
    });

    function animateProgress() {
      let w = 0;
      const iv = setInterval(() => {
        w = Math.min(w + Math.random() * 8, 90);
        progressBar.style.width = w + '%';
        if (w >= 90) clearInterval(iv);
      }, 400);
    }

    // ── Toast ─────────────────────────────────────────────────────────────────
    function showToast(type, title, body) {
      const toast = document.getElementById('toast');
      document.getElementById('toastTitle').textContent = title;
      document.getElementById('toastBody').textContent = body;
      toast.className = `toast ${type} show`;
      setTimeout(() => toast.classList.remove('show'), 5000);
    }

    loadStatus();
  </script>
</body>
</html>
